    <title>Question 1</title>
    <script>
        //Write a JavaScript code to find whether the entered number is even or odd.
        var number = 6;
        document.write("The given number is " + number + "<br>");
        if(number % 2 == 0){
            document.write("The above number is even.");
        }
        else{
            document.write("The above number is odd.")
        }
    </script>
