<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <script>
        //Write a JavaScript code to display even numbers from 11 to 30 using a while loop.
        document.write("Even numbers from 11 to 30 using a while loop are:<br>")
        i=11; 
        while(i<=30){
            if(i % 2 == 0){
                document.write(i + "<br>");
            }
            i++;
        }
    </script>
