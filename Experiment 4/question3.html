    <title>Question 3</title>
    <script>
        //Write a JavaScript code to display the sum of 1 to 10 numbers using a for loop.
        let sum = 0;
        for(i=1; i<=10; i++){
            sum = sum + i;
        }
        document.write("Sum of 1 to 10 is " + sum + ".");
    </script>
