<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4</title>
    <script>
        //Write a JavaScript code to perform arithmetic operations on two numbers using a switch case statement.
        let a=2, b=6;
        document.write("The two given numbers are: " + a + " & "+ b);
        let operation = 3;
        
        document.write("<br>Select the operation:<br> 1: Addition <br> 2:Subtraction <br> 3:Multiplication <br> 4:Division <br><br>")
        switch(operation){
            case 1:
                sum = a + b;
                document.write("Addition of two numbers is " + sum);
                break;
            
            case 2:
                diff = a - b;
                document.write("Subtraction of two numbers is " + diff);
                break;
             
            case 3:
                mult = a * b;
                document.write("Multiplication of two numbers is " + mult);
                break;
                
            case 4:
                div = a / b;
                document.write("Division of two numbers is " + div);
                break;    

            default:
                document.write("Enter a valid output.");    
        }
    </script>
</head>
